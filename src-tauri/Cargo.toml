[package]
name = "quick-md"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/mtdxmtdx/Quick-MD"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
